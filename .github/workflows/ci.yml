name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No leftover conflict markers
        run: |
          ! grep -rIn --exclude-dir=.git -E '^(<<<<<<<|>>>>>>>)' .

  syntax:
    name: syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Parse every Ruby file
        run: |
          find . -name '*.rb' -not -path './.git/*' -print0 | xargs -0 -r -n1 ruby -c
